# templates/ci/python-ci.yml
# Copy to .github/workflows/ci.yml in a Python project.
# Make it a required status check on main (branch protection).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12        # match requires-python in pyproject.toml
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Optional once type hints are in place:
      # - run: uv run pyright
